{% extends "base.html" %}
{% block content %}
  <h3>OfficeRide</h3>
  <p>Share your commute, split the cost.</p>
  {% if user.is_authenticated %}
    <a class="btn btn-primary" href="{% url 'accounts:profile' %}">Go to my profile</a>
  {% else %}
    <a class="btn btn-primary" href="{% url 'accounts:register' %}">Create an account</a>
    <a class="btn btn-outline-secondary" href="{% url 'accounts:login' %}">Log in</a>
  {% endif %}
{% endblock %}
