{% extends "base.html" %}
{% block content %}
  <div class="card p-4">
    <h1 class="h2">Share your commute, split the cost.</h1>
    <p class="text-secondary">Ride to the office with people from your company, all across Bangalore.</p>
    {% if user.is_authenticated %}
      <a class="btn btn-primary btn-lg w-100 mb-2" href="{% url 'rides:find' %}"><i class="bi bi-search"></i> Find a ride</a>
      <a class="btn btn-outline-primary btn-lg w-100" href="{% url 'rides:offer' %}"><i class="bi bi-plus-circle"></i> Offer a ride</a>
    {% else %}
      <a class="btn btn-primary btn-lg w-100 mb-2" href="{% url 'accounts:register' %}">Create an account</a>
      <a class="btn btn-outline-primary btn-lg w-100" href="{% url 'accounts:login' %}">Log in</a>
    {% endif %}
  </div>
{% endblock %}
