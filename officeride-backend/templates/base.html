<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OfficeRide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="{% url 'home' %}">OfficeRide</a>
  <div class="d-flex gap-2 align-items-center">
    {% if user.is_authenticated %}
      <a class="btn btn-sm btn-outline-light" href="{% url 'accounts:profile' %}">Profile</a>
      <a class="btn btn-sm btn-outline-light" href="{% url 'accounts:documents' %}">Documents</a>
      <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
        {% csrf_token %}
        <button class="btn btn-sm btn-light">Log out</button>
      </form>
    {% else %}
      <a class="btn btn-sm btn-outline-light" href="{% url 'accounts:login' %}">Log in</a>
      <a class="btn btn-sm btn-light" href="{% url 'accounts:register' %}">Sign up</a>
    {% endif %}
  </div>
</nav>
<div class="container mt-4 mb-5" style="max-width: 560px;">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
