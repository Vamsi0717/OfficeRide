{% extends "base.html" %}
{% block content %}
  <h3>Log in</h3>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary mt-3">Log in</button>
  </form>
  <p class="mt-3">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
{% endblock %}
