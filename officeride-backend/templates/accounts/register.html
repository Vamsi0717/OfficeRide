{% extends "base.html" %}
{% block content %}
  <h3>Create your account</h3>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button class="btn btn-primary mt-3">Sign up</button>
  </form>
  <p class="mt-3">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}
